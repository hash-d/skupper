---

# TODO: move binary determination to a role
- name: Determine whether command "{{ command.key }}" is on path
  ansible.builtin.command:
    cmd: which {{ command.key }}
  ignore_errors: true
  changed_when: false
  register: which

- name: Check whether we're running on git
  ansible.builtin.command:
    cmd: git rev-parse --show-toplevel
  register: git_root
  ignore_errors: true
  changed_when: false

- name: Check whether command is locally built
  ansible.builtin.stat:
    path: "{{ git_root.stdout }}/{{ command.key }}"
  register: local_cmd
  when: git_root is success

- name: Determine which binary to use {{ command.key }}
  vars:
    cmd: "{{
        which.stdout if which is success else
          local_cmd.stat.path if local_cmd.stat.exists else
            None
        }}"
    tests: "{{ command.value.tests }}"
  changed_when: false
  register: local_binary_result
  ansible.builtin.command:
    cmd: "{{ cmd }} {{ args }}"
  loop: "{{ tests }}"
  loop_control:
    loop_var: args
  when:
  - cmd is defined
  - cmd is not none
  - cmd != ""

- name: Command result
  ansible.builtin.set_fact:
    command_result: "{{
      'failed' if true in local_binary_result | community.general.json_query ('results[].failed') else
        'skipped' if true in local_binary_result | community.general.json_query ('results[].skipped') else
          'ok'
      }}"

- debug:
    var: command_result

- name: Record
  ansible.builtin.set_fact:
    local_binary_results: "{{ local_binary_results | default({}) | ansible.builtin.combine ( { command.key: command_result } ) }}"
